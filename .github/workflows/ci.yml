name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test workspace (unit + KAT + difficulty + jackpot gates)
        run: cargo test --workspace --locked
      - name: Clippy (consensus code must be lint-clean)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Bench smoke (compile only, timing is device-matrix work)
        run: cargo bench -p lm-pow -- --test
      # The CPU-only path is a real, advertised build (boxes without
      # libOpenCL; lm-mobile) — keep it compiling.
      - name: CPU-only miner build (no OpenCL)
        run: cargo check -p lm-miner --no-default-features
      - name: Mobile facade host tests
        run: cargo test -p lm-mobile --locked

  # Doc 05 §5.7 determinism gate: LuckyHash vectors must agree
  # byte-for-byte across architectures (endianness discipline §5.1). The
  # KAT suite pins seed/mem/out for fixed (header, nonce, height), so a
  # big-endian slip or a word-size assumption fails here on aarch64 even
  # when x86_64 is green. Hosted ARM runners are free for public repos;
  # this is a CPU-first coin, so ARM is a first-class mining target, not
  # an exotic port.
  test-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # lm-miner links the system libOpenCL directly (no wrapper crates, by
      # design — offline builds keep working). The x86 image ships it; do not
      # assume the ARM one does. ocl-icd-opencl-dev is headers + loader only:
      # no GPU is needed to build, and no test opens a device.
      - name: Install OpenCL ICD loader (link-time only, no GPU)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ocl-icd-opencl-dev
      - name: Test workspace on aarch64 (KAT vectors must match x86_64)
        run: cargo test --workspace --locked
      - name: Clippy on aarch64
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Bench smoke (compile only)
        run: cargo bench -p lm-pow -- --test

  # The desktop wallet is a separate Cargo workspace (GUI deps are heavy
  # and platform-specific), so the workspace job above never touched it.
  wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lm-wallet/ui/package-lock.json
      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - name: Build frontend
        working-directory: lm-wallet/ui
        run: npm ci && npm run build
      - name: Wallet backend tests
        working-directory: lm-wallet/src-tauri
        run: cargo test --locked
      - name: Wallet backend clippy
        working-directory: lm-wallet/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  # Kotlin app unit tests (the JNI .so is only needed at packaging time;
  # these tests cover the decision-packing contract on the JVM).
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform + build tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - name: Kotlin unit tests
        working-directory: lm-mobile/android
        run: gradle testDebugUnitTest --no-daemon --stacktrace
