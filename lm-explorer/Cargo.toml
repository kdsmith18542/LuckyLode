[package]
name = "lm-explorer"
version = "0.1.0"
edition = "2021"
description = "Lucky Lode reference block explorer: tip-following SQLite indexer + read-only HTTP UI (no txindex needed)"
license = "GPL-3.0-only"

[dependencies]
lm-stratum = { path = "../lm-stratum" }
lm-rewards = { path = "../lm-rewards" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[[bin]]
name = "explorer"
path = "src/main.rs"
