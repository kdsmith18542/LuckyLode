[package]
name = "lm-casino"
version = "0.1.0"
edition = "2021"
description = "Lucky Lode first-party casino (doc 14): provably-fair RNG, 91% RTP slot math, house ledger with exact edge split, participation tiers, bonus engine, node custody and HTTP service"
