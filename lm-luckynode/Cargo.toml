[package]
name = "lm-luckynode"
version = "0.1.0"
edition = "2021"
description = "Luckynode registry, heartbeat liveness, tenure-weighted draws, and draw notarization (internal/18, pool-side v1 — no consensus)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2.2"

[[bin]]
name = "luckynode"
path = "src/bin/luckynode.rs"
