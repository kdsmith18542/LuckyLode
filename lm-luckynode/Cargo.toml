[package]
name = "lm-luckynode"
version = "0.1.0"
edition = "2021"
description = "Luckynode participation over node RPC: ln-* identity registration, per-epoch heartbeat liveness, draw status"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "luckynode"
path = "src/bin/luckynode.rs"
