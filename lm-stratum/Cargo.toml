[package]
name = "lm-stratum"
version = "0.1.0"
edition = "2021"
description = "Reference pool wire layer (Lucky Lode): Stratum V1 + V2 (Noise), Lucky Lode job profile, node/mock providers, threaded server + client, HTTP dashboards"
license = "GPL-3.0-only"

[dependencies]
lm-pow = { path = "../lm-pow" }
lm-pool = { path = "../lm-pool" }
lm-rewards = { path = "../lm-rewards" }
primitive-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1.0"
# Stratum V2 secure session (sv2-spec 04): Noise NX over secp256k1 with
# ElligatorSwift handshake keys + ChaCha20-Poly1305, delegated to the
# reference implementation (MIT OR Apache-2.0). secp256k1 is the same
# version noise_sv2 uses, for the XOnlyPublicKey/Keypair types.
noise_sv2 = "2.0.0"
libc = "0.2"
secp256k1 = "0.28"

[dev-dependencies]
# Reference-implementation codec for the V2 interop test (same versions the
# reference pool/miner use; MIT OR Apache-2.0, GPL-compatible for tests).
codec_sv2 = { version = "7.0.0", features = ["noise_sv2", "std"] }
framing_sv2 = "8.0.0"
