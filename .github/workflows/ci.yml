name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test workspace (unit + KAT + difficulty + jackpot gates)
        run: cargo test --workspace --locked
      - name: Clippy (consensus code must be lint-clean)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Bench smoke (compile only, timing is device-matrix work)
        run: cargo bench -p lm-pow -- --test
